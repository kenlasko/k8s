apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: registry
  namespace: registry
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: registry
  ingress:
    - fromEntities:
        - remote-node
        - ingress
      toPorts:
        - ports:
            - port: "5000"
    # The weekly registry-prune-cache job deletes old Kaniko cache manifests through the API
    - fromEndpoints:
        - matchLabels:
            app: registry-prune-cache
      toPorts:
        - ports:
            - port: "5000"
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
          rules:
            dns:
              - matchPattern: "*"
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "443"
