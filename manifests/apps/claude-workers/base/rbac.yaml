# Read-only cluster access for the Claude workers. Secrets are deliberately excluded.
# Any changes Claude wants to make to the cluster go through a PR and ArgoCD.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: claude-worker
  namespace: claude-workers

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: claude-worker-readonly
rules:
- apiGroups: [""]
  resources:
  - configmaps
  - endpoints
  - events
  - limitranges
  - namespaces
  - nodes
  - persistentvolumeclaims
  - persistentvolumes
  - pods
  - pods/log
  - replicationcontrollers
  - resourcequotas
  - serviceaccounts
  - services
  verbs: ["get", "list", "watch"]
- apiGroups:
  - apps
  - batch
  - autoscaling
  - policy
  - networking.k8s.io
  - gateway.networking.k8s.io
  - storage.k8s.io
  - discovery.k8s.io
  - rbac.authorization.k8s.io
  - apiextensions.k8s.io
  - argoproj.io
  - cert-manager.io
  - cilium.io
  - external-secrets.io
  - longhorn.io
  - postgresql.cnpg.io
  - volsync.backube
  - monitoring.coreos.com
  resources: ["*"]
  verbs: ["get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: claude-worker-readonly
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: claude-worker-readonly
subjects:
- kind: ServiceAccount
  name: claude-worker
  namespace: claude-workers
