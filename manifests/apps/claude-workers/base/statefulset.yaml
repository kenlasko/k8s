apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: claude-worker
  namespace: claude-workers
spec:
  serviceName: claude-worker
  replicas: 3 # Keep in sync with WORKER_COUNT in env-vars.yaml
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app.kubernetes.io/name: claude-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: claude-worker
      annotations:
        # kubectl exec/logs target the worker, not the dind sidecar
        kubectl.kubernetes.io/default-container: claude-worker
    spec:
      serviceAccountName: claude-worker
      priorityClassName: low-priority
      # Give an in-flight task a chance to finish before the pod is killed
      terminationGracePeriodSeconds: 600
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: claude-worker
      initContainers:
      # Rootless Docker daemon for Claude's containers (e2e stacks, screenshots). A native sidecar, so it starts
      # before the worker and stops after it. It shares the pod's network, so published ports are on localhost for
      # the worker, and mounts /workspace and /tmp at the same paths, so bind mounts from a worktree resolve.
      - name: dind
        image: docker.io/library/docker:29.9.1-dind-rootless
        restartPolicy: Always
        # Starting with "dockerd" skips the entrypoint's default args, which add an unauthenticated tcp://0.0.0.0:2375
        # listener when TLS is off. The socket is kept out of /run, which rootlesskit replaces with a private copy.
        args: ["dockerd", "--host=unix:///docker/docker.sock"]
        env:
        # Without --state-dir, rootlesskit puts its port API socket in /tmp/rootlesskit<random>. /tmp is shared with the
        # worker, whose clean_tmp deletes it after TMP_CLEAN_MINUTES, and every "docker run -p" fails from then on.
        - name: DOCKERD_ROOTLESS_ROOTLESSKIT_FLAGS
          value: --state-dir=/home/rootless/.rootlesskit
        startupProbe:
          exec:
            command: ["docker", "--host=unix:///docker/docker.sock", "version"]
          periodSeconds: 2
          failureThreshold: 60
        # Port publishing needs rootlesskit's API socket; restart the sidecar if it goes missing
        livenessProbe:
          exec:
            command: ["test", "-S", "/home/rootless/.rootlesskit/api.sock"]
          periodSeconds: 60
          failureThreshold: 2
        # rootlesskit needs privileged for its user and mount namespaces, but the daemon and every container it
        # runs are uid 1000 on the node, so a container escape doesn't land as root
        securityContext:
          privileged: true
          runAsUser: 1000
          runAsGroup: 1000
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            memory: 6Gi
        volumeMounts:
        - name: docker-sock
          mountPath: /docker
        # Mounted one level above Docker's data root: the emptyDir itself is owned by root on the node, which is unmapped
        # inside rootlesskit's user namespace, so dockerd can't chmod it. The entrypoint creates docker/ in it as uid 1000.
        - name: docker-data
          mountPath: /home/rootless/.local/share
        - name: workspace
          mountPath: /workspace
        - name: tmp
          mountPath: /tmp
      containers:
      - name: claude-worker
        image: registry.laskonet.com/claude-worker:latest
        imagePullPolicy: Always
        command: ["/bin/bash", "/opt/worker/worker.sh"]
        env:
        - name: HOME
          value: /workspace/home
        # Puts the claude-log / claude-status helpers from the worker-script ConfigMap on the PATH for kubectl exec
        - name: PATH
          value: /opt/worker:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
        - name: DOCKER_HOST
          value: unix:///docker/docker.sock
        envFrom:
        - configMapRef:
            name: env-vars
        - secretRef:
            name: claude-secrets
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        resources:
          requests:
            cpu: 250m
            memory: 1Gi
          limits:
            memory: 10Gi
        volumeMounts:
        - name: workspace
          mountPath: /workspace
        - name: tmp
          mountPath: /tmp
        - name: worker-script
          mountPath: /opt/worker
        - name: docker-sock
          mountPath: /docker
      volumes:
      # Node-local scratch space for npm, test runners and coverage. Exceeding sizeLimit evicts the pod.
      - name: tmp
        emptyDir:
          sizeLimit: 10Gi
      - name: docker-sock
        emptyDir:
          medium: Memory
          sizeLimit: 1Mi
      # Docker images, containers and volumes. Node-local, so images are re-pulled after the pod moves or restarts.
      # An emptyDir rather than a volumeClaimTemplate, which can't be added to an existing StatefulSet.
      - name: docker-data
        emptyDir:
          sizeLimit: 30Gi
      - name: worker-script
        configMap:
          name: worker-script
          defaultMode: 0555
  volumeClaimTemplates:
  - metadata:
      name: workspace
    spec:
      accessModes: ["ReadWriteOnce"]
      storageClassName: longhorn
      resources:
        requests:
          storage: 20Gi
