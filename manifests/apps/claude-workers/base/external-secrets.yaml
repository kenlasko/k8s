# Expects an Akeyless secret at /claude-workers with two properties:
#   oauthToken:  output of `claude setup-token` (long-lived Claude subscription token)
#   githubToken: fine-grained GitHub PAT (Contents, Issues, Pull requests: read/write) scoped to the repos in REPOS
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: claude-secrets
  namespace: claude-workers
spec:
  refreshInterval: 24h
  secretStoreRef:
    name: akeyless
    kind: ClusterSecretStore
  target:
    name: claude-secrets
  dataFrom:
  - extract:
      key: /claude-workers
