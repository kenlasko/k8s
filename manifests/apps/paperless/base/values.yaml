image:
  repository: paperless-ngx/paperless-ngx
  tag: 3.5.0
  registry: ghcr.io
priorityClassName: low-priority
extraLabels:
  cnpg-client: "true"
securityContext:
  allowPrivilegeEscalation: true
  readOnlyRootFilesystem: false
  runAsNonRoot: false
  runAsUser: 0
  runAsGroup: 100
  seccompProfile:
    type: RuntimeDefault
  capabilities:
    drop: ["ALL"]
    add:
    - "CHOWN"
    - "SETGID"
    - "SETUID"
    - "DAC_OVERRIDE"
env:
- name: TZ
  value: "America/Toronto"
resources:
  requests:
    cpu: 10m
    memory: 450Mi
  limits:
    # cpu: 200m
    memory: 1.5Gi
service:
  port: 8000
# Paperless 3.5.0+ only allows PAPERLESS_URL's host plus localhost; the kubelet
# probe sends the pod IP as Host, so pin it to localhost to avoid a 400.
livenessProbe:
  httpGet:
    path: /
    port: http
    httpHeaders:
    - name: Host
      value: localhost
  initialDelaySeconds: 15
  periodSeconds: 60
  timeoutSeconds: 5
envFrom:
- configMapRef:
    name: env-vars
- secretRef:
    name: env-secrets
persistentVolume:
  type: nfs
  size: 20Gi
  mountPath: /paperless
extraVolumeMounts:
- name: paperless-config
  mountPath: /usr/src/paperless/data
  subPath: data
- name: paperless-config
  mountPath: /usr/src/paperless/media
  subPath: media
backup:
  location: cloudflare
  schedule: "50 06 * * *"