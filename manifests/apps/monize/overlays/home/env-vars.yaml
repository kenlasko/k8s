apiVersion: v1
kind: ConfigMap
metadata:
  name: env-vars-backend
  namespace: monize
data:
  NODE_ENV: "production"
  DATABASE_HOST: "home-rw.cnpg.svc.cluster.local"
  DATABASE_NAME: monize
  RLS_MODE: "enforce"
  CLUSTER_MODE: "multi"
  PUBLIC_APP_URL: https://monize.laskonet.com
  OIDC_ISSUER_URL: https://auth.laskonet.com
  OIDC_CALLBACK_URL: https://monize.laskonet.com/api/v1/auth/oidc/callback
  OAUTH_DEBUG_LOG: "false"
  LOCAL_AUTH_ENABLED: "true"
  REGISTRATION_ENABLED: "false"
  SMTP_HOST: "mail.smtp2go.com"
  SMTP_PORT: "587"
  SMTP_SECURE: "false"  # Not required for STARTTLS
  EMAIL_FROM: "monize@laskonet.com"
  ATTACHMENT_STORAGE_PROVIDER: "s3"
  ATTACHMENT_S3_BUCKET: "monize-attachments"
  ATTACHMENT_S3_ENDPOINT: "https://fa831d805d821b7c4627b464a9845a9d.r2.cloudflarestorage.com"
  ATTACHMENT_S3_REGION: "auto"
  ATTACHMENT_S3_FORCE_PATH_STYLE: "true"
  # Existing attachments relocate themselves: on boot and hourly at :50 the
  # bytes are copied into R2 and each local copy is deleted once its replacement
  # has been read back and verified. The local provider must stay configured
  # (and the nfs-monize PVC stay mounted) until the backlog reaches zero, since
  # the source is read through its own provider.
  ATTACHMENT_CONTAINER_DIR: "/data/attachments"
  # Automatic backups live in Cloudflare R2 rather than on the PVC.
  # Forward-only switch: artifacts already under BACKUP_CONTAINER_DIR stay on
  # the volume and are invisible to the R2 store's listing. Keep the nfs-monize
  # PVC until R2 holds a full retention window.
  BACKUP_STORAGE_PROVIDER: "s3"
  BACKUP_STORE_S3_BUCKET: "monize-backups"
  BACKUP_STORE_S3_ENDPOINT: "https://fa831d805d821b7c4627b464a9845a9d.r2.cloudflarestorage.com"
  BACKUP_STORE_S3_REGION: "auto"
  BACKUP_STORE_S3_FORCE_PATH_STYLE: "true"
  # Read only by the "local" store; retained so the pre-switch artifacts on the
  # PVC stay documented.
  BACKUP_CONTAINER_DIR: "/data/backups"
  # AI_DEFAULT_PROVIDER: ollama
  # AI_DEFAULT_MODEL: "llama3.2"
  # AI_DEFAULT_BASE_URL: http://ollama.ollama.svc.cluster.local:11434
  # AI_DEFAULT_BASE_URL: http://192.168.1.2:11434

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: env-vars-frontend
  namespace: monize
data:
  NODE_ENV: "production"
  INTERNAL_API_URL: http://monize-backend-service:3001
  PUBLIC_APP_URL: https://monize.laskonet.com
