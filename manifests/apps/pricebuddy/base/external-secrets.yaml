---
# Rendered as /app/.env. start-app.sh only generates a new .env (and a new
# APP_KEY) when the file is missing or empty, so a populated file keeps the
# key stable across restarts. Values are single-quoted so phpdotenv reads them
# literally; they must not contain a single quote.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pricebuddy-env
  namespace: pricebuddy
spec:
  refreshInterval: 24h
  secretStoreRef:
    name: akeyless
    kind: ClusterSecretStore
  target:
    name: pricebuddy-env
    template:
      engineVersion: v2
      data:
        .env: |
          APP_KEY='{{ .appKey }}'
          DB_USERNAME='{{ .dbUsername }}'
          DB_PASSWORD='{{ .dbPassword }}'
          APP_USER_EMAIL='{{ .adminEmail }}'
          APP_USER_PASSWORD='{{ .adminPassword }}'
  data:
  - secretKey: appKey
    remoteRef:
      key: /pricebuddy
      property: APP_KEY
  - secretKey: adminEmail
    remoteRef:
      key: /pricebuddy
      property: APP_USER_EMAIL
  - secretKey: adminPassword
    remoteRef:
      key: /pricebuddy
      property: APP_USER_PASSWORD
  - secretKey: dbUsername
    remoteRef:
      key: /database/pricebuddy
      property: username
  - secretKey: dbPassword
    remoteRef:
      key: /database/pricebuddy
      property: password

---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: useraccount-pricebuddy
  namespace: cnpg
  labels:
    cnpg.io/reload: "true"
spec:
  refreshInterval: 24h
  secretStoreRef:
    name: akeyless
    kind: ClusterSecretStore
  target:
    name: useraccount-pricebuddy
    template:
      type: kubernetes.io/basic-auth
  dataFrom:
  - extract:
      key: /database/pricebuddy
      conversionStrategy: Default
      decodingStrategy: None
      metadataPolicy: None
