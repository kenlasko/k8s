---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: env-secrets-tracearr
  namespace: media
spec:
  refreshInterval: 24h
  secretStoreRef:
    name: akeyless
    kind: ClusterSecretStore
  target:
    name: env-secrets-tracearr
    template:
      engineVersion: v2
      data:
        JWT_SECRET: "{{ .jwtSecret }}"
        COOKIE_SECRET: "{{ .cookieSecret }}"
        DB_PASSWORD: "{{ .dbPassword }}"
        DATABASE_URL: "postgres://tracearr:{{ .dbPassword }}@home-rw.cnpg.svc.cluster.local:5432/tracearr"
        REDIS_URL: "redis://:{{ .redisPassword }}@redis-service.redis.svc.cluster.local:6379/1"
        OIDC_CLIENT_ID: "{{ .oidcClientId }}"
        OIDC_CLIENT_SECRET: "{{ .oidcClientSecret }}"
  data:
  - secretKey: jwtSecret
    remoteRef:
      key: /tracearr
      property: JWT_SECRET
  - secretKey: cookieSecret
    remoteRef:
      key: /tracearr
      property: COOKIE_SECRET
  - secretKey: dbPassword
    remoteRef:
      key: /database/tracearr
      property: password
  - secretKey: redisPassword
    remoteRef:
      key: /redis
      property: RI_REDIS_PASSWORD
  - secretKey: oidcClientId
    remoteRef:
      key: /tracearr
      property: OIDC_CLIENT_ID
  - secretKey: oidcClientSecret
    remoteRef:
      key: /tracearr
      property: OIDC_CLIENT_SECRET

---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: useraccount-tracearr
  namespace: cnpg
  labels:
    cnpg.io/reload: "true"
spec:
  refreshInterval: 24h
  secretStoreRef:
    name: akeyless
    kind: ClusterSecretStore
  target:
    name: useraccount-tracearr
    template:
      type: kubernetes.io/basic-auth
  dataFrom:
  - extract:
      key: /database/tracearr
      conversionStrategy: Default
      decodingStrategy: None
      metadataPolicy: None
