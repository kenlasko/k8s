image:
  repository: connorgallopo/tracearr
  tag: 2.5.0
  registry: ghcr.io
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false  # needs /app/data/image-cache
  runAsNonRoot: true
  runAsUser: 1001   # Dockerfile user: 1001:1001 (tracearr:nodejs)
  runAsGroup: 1001
  seccompProfile:
    type: RuntimeDefault
  capabilities:
    drop: ["ALL"]
env:
- name: NODE_ENV
  value: "production"
- name: HOST
  value: "0.0.0.0"
- name: PORT
  value: "3000"
- name: LOG_LEVEL
  value: "info"
- name: CORS_ORIGIN
  value: "*"
- name: TZ
  value: "America/Toronto"
- name: IMAGE_CACHE_DIR
  value: "/app/data/image-cache"
- name: OIDC_ISSUER_NAME
  value: "Pocket ID"
- name: OIDC_ISSUER_URL
  value: "https://auth.laskonet.com"
envFrom:
- secretRef:
    name: env-secrets-tracearr  # JWT_SECRET, COOKIE_SECRET, DB_PASSWORD, DATABASE_URL, REDIS_URL
resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    # cpu: 2000m
    memory: 1Gi
service:
  port: 3000
livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 15
  periodSeconds: 30
  timeoutSeconds: 10
  failureThreshold: 3
readinessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3
startupProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 5
  periodSeconds: 5
  failureThreshold: 30
persistentVolume:
  type: nfs
  size: 5.5Gi
  mountPath: /app/data/image-cache
# backup:
#   location: cloudflare
#   schedule: "10 08 * * *"
